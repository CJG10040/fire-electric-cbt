<div class="undo-fab" id="undo-fab">
  <button type="button" class="undo-btn" id="undo-btn" onclick="undoDo()" disabled title="되돌릴 작업이 없어요" aria-label="되돌리기">↶<span class="undo-count" id="undo-count"></span></button>
  <button type="button" class="undo-btn" id="redo-btn" onclick="redoDo()" disabled title="다시 실행할 작업이 없어요" aria-label="다시 실행">↷</button>
  <button type="button" class="undo-btn undo-list" id="undo-list-btn" onclick="undoTogglePanel(event)" title="최근 작업 목록 · 여러 단계 되돌리기" aria-label="작업 기록">🕘</button>
</div>
<div class="undo-panel" id="undo-panel" role="dialog" aria-label="작업 기록" style="display:none" onclick="event.stopPropagation()">
  <div class="undo-panel-head">
    <strong>🕘 작업 기록</strong>
    <span class="undo-keys">Ctrl+Z 되돌리기 · Ctrl+Y 다시 실행</span>
    <button type="button" class="undo-x" onclick="undoTogglePanel(event)" aria-label="닫기">✕</button>
  </div>
  <div class="undo-panel-body" id="undo-panel-body"></div>
  <div class="undo-panel-foot">
    <label class="undo-back"><input type="checkbox" id="undo-back-chk" onchange="undoSetBack(this.checked)"> 뒤로가기 버튼(휴대폰 포함)도 되돌리기로 사용</label>
    <button type="button" class="undo-clear" onclick="undoClear()">기록 지우기</button>
    <div class="undo-note">메모 입력·내 암기노트 글은 되돌리기 대상이 아니에요. 새로고침하면 작업 기록은 사라지지만 저장된 오답·풀이 기록은 그대로예요.</div>
  </div>
</div>
<div class="undo-snack" id="undo-snack" role="status" aria-live="polite" style="display:none">
  <span id="undo-snack-text"></span>
  <button type="button" onclick="undoDo()">↶ 되돌리기</button>
</div>
